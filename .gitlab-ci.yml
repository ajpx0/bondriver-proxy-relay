stages:
  - prepare
  - build
  - release

variables:
  RELEASE_SOURCE_BRANCH:
    value: develop
    description: Create Release Commit のマージ元ブランチ
  CREATE_RELEASE_COMMIT:
    value: "false"
    options: ["false", "true"]
    description: true で develop を main にマージするリリースコミットを作成

default:
  interruptible: true

.tauri-linux:
  image: node:24-bookworm
  variables:
    CARGO_HOME: $CI_PROJECT_DIR/.cargo
  cache:
    key: tauri-linux
    paths:
      - .cargo/registry/
      - .pnpm-store/
      - src-tauri/target/
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev build-essential file
    - curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
    - export PATH="$CARGO_HOME/bin:$PATH"
    - npm i -g pnpm@12
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile

.tauri-windows:
  tags: [saas-windows-medium-amd64]
  variables:
    CARGO_HOME: $CI_PROJECT_DIR\.cargo
  cache:
    key: tauri-windows
    paths:
      - .cargo/registry/
      - .pnpm-store/
      - src-tauri/target/
  before_script:
    - $ProgressPreference = 'SilentlyContinue'
    - $v = (Invoke-RestMethod https://nodejs.org/dist/index.json | Where-Object { $_.version -like 'v24.*' } | Select-Object -First 1).version
    - Invoke-WebRequest "https://nodejs.org/dist/$v/node-$v-win-x64.zip" -OutFile node.zip
    - Expand-Archive node.zip -DestinationPath C:\node
    - $env:Path = "C:\node\node-$v-win-x64;$env:CARGO_HOME\bin;$env:Path"
    - Invoke-WebRequest https://win.rustup.rs/x86_64 -OutFile rustup-init.exe
    - .\rustup-init.exe -y --profile minimal
    - npm i -g pnpm@12
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile

build-linux:
  extends: .tauri-linux
  stage: build
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"
    - if: $CI_PIPELINE_SOURCE == "web" && $CREATE_RELEASE_COMMIT != "true"
  script:
    - pnpm tauri build --bundles deb

build-windows:
  extends: .tauri-windows
  stage: build
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"
    - if: $CI_PIPELINE_SOURCE == "web" && $CREATE_RELEASE_COMMIT != "true"
  script:
    - pnpm tauri build --bundles nsis

release-prepare:
  stage: prepare
  image: alpine:3.20
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"
  script:
    - apk add --no-cache tzdata coreutils
    - now=$(date +%s)
    - echo "RELEASE_TAG=$(TZ=Asia/Tokyo date -d @$now +%Y.%m.%d)" >> release.env
    - echo "RELEASE_VERSION=$(TZ=Asia/Tokyo date -d @$now +%Y.%-m.%-d)" >> release.env
    - cat release.env
  artifacts:
    reports:
      dotenv: release.env

release-linux:
  extends: .tauri-linux
  stage: build
  needs: [release-prepare]
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"
  script:
    - pnpm tauri build --bundles deb --config "{\"version\":\"$RELEASE_VERSION\"}"
    - |
      for f in src-tauri/target/release/bundle/deb/*.deb $(find src-tauri/target/release -maxdepth 1 -type f -perm -u+x); do
        n=$(basename "$f")
        u="$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/release/$RELEASE_TAG/$n"
        curl --fail -H "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$f" "$u"
        printf '%s\t%s\n' "$n" "$u" >> release-assets-linux.txt
      done
  artifacts:
    paths:
      - release-assets-linux.txt

release-windows:
  extends: .tauri-windows
  stage: build
  needs: [release-prepare]
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"
  script:
    - '@{ version = $env:RELEASE_VERSION } | ConvertTo-Json | Set-Content -Encoding ascii version.json'
    - pnpm tauri build --bundles nsis --config "$PWD\version.json"
    - |
      $files = @(Get-ChildItem src-tauri\target\release\bundle\nsis\*.exe) + @(Get-ChildItem src-tauri\target\release\*.exe)
      foreach ($f in $files) {
        $u = "$env:CI_API_V4_URL/projects/$env:CI_PROJECT_ID/packages/generic/release/$env:RELEASE_TAG/$($f.Name)"
        Invoke-RestMethod -Method Put -Uri $u -Headers @{ 'JOB-TOKEN' = $env:CI_JOB_TOKEN } -InFile $f.FullName
        "$($f.Name)`t$u" | Add-Content release-assets-windows.txt
      }
  artifacts:
    paths:
      - release-assets-windows.txt

release-publish:
  stage: release
  image: alpine:3.20
  needs: [release-prepare, release-linux, release-windows]
  interruptible: false
  variables:
    GIT_DEPTH: "0"
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"
  script:
    - apk add --no-cache curl jq git
    - |
      links=$(cat release-assets-*.txt | jq -R -s 'split("\n") | map(select(length > 0) | split("\t") | {name: .[0], url: .[1], link_type: "package"})')
    - prev=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
    - notes=$(git log --format='- %s (%h)' ${prev:+$prev..}HEAD)
    - |
      jq -n --arg tag "$RELEASE_TAG" --arg ref "$CI_COMMIT_SHA" --arg desc "$notes" --argjson links "$links" '{tag_name: $tag, name: $tag, ref: $ref, description: $desc, assets: {links: $links}}' > release.json
    - |
      curl --fail-with-body -H "JOB-TOKEN: $CI_JOB_TOKEN" -H "Content-Type: application/json" -d @release.json "$CI_API_V4_URL/projects/$CI_PROJECT_ID/releases"

create-release-commit:
  stage: prepare
  image: alpine:3.20
  resource_group: create-release-commit
  variables:
    GIT_DEPTH: "0"
  rules:
    - if: $CI_PIPELINE_SOURCE == "web" && $CREATE_RELEASE_COMMIT == "true"
  script:
    - apk add --no-cache git tzdata
    - git config user.name "$GITLAB_USER_NAME"
    - git config user.email "$GITLAB_USER_EMAIL"
    - git remote set-url origin "https://oauth2:${RELEASE_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    - git fetch origin main "$RELEASE_SOURCE_BRANCH"
    - git checkout -B main origin/main
    - git merge --no-ff -m "$(TZ=Asia/Tokyo date '+%Y.%m.%d')" "origin/$RELEASE_SOURCE_BRANCH"
    - git push origin main
